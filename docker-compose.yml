# Local stack: Postgres + API (hot reload) + Vite (HMR). Ingestion of the real inbox is opt-in:
#   docker compose --profile ingest up ingest
# In a git worktree, run scripts/worktree-env.sh first so it gets its own stack.
name: jobtracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
      POSTGRES_DB: jobtracker
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"  # DBeaver / DataGrip: localhost:5433, jobtracker/jobtracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    command: ["jobtracker", "db", "migrate"]
    env_file: [{ path: .env, required: false }]
    environment: &backend-env
      APP_ENV: local
      DATABASE_URL: postgresql://jobtracker:jobtracker@db:5432/jobtracker
    volumes: &backend-src
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      # Your `ant auth login` session. Read-write: the SDK writes refreshed tokens back.
      - ${HOME}/.config/anthropic:/root/.config/anthropic
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    command:
      ["uvicorn", "--factory", "jobtracker.api.app:create_app", "--host", "0.0.0.0", "--port", "8000",
       "--reload", "--reload-dir", "/app/src"]
    env_file: [{ path: .env, required: false }]
    environment:
      <<: *backend-env
      AUTH_DEV_BYPASS: "${AUTH_DEV_BYPASS:-true}"
    volumes: *backend-src
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: node:22-alpine
    working_dir: /app
    # npm ci, not install: the image's npm would rewrite the lockfile written by the host's npm.
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on: [api]

  ingest:
    profiles: [ingest]
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    command: ["jobtracker", "ingest", "--loop", "900"]
    env_file: [{ path: .env, required: true }]
    environment: *backend-env
    volumes: *backend-src
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  web_node_modules:
